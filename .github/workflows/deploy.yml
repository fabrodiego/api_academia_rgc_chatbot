name: build-e-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:      # botao "Run workflow" manual no GitHub

concurrency: deploy        # nunca 2 deploys ao mesmo tempo

permissions:
  contents: read
  packages: write          # permite enviar a imagem ao GHCR

env:
  IMAGEM: ghcr.io/fabrodiego/api_academia_rgc_chatbot
  NAMESPACE: chatbot-rgc
  DEPLOYMENT: chatbot-rgc

jobs:
  build-e-deploy:
    runs-on: [self-hosted, chatbot-rgc]
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        run: |
          docker build -t $IMAGEM:latest -t $IMAGEM:${{ github.sha }} .
          docker push --all-tags $IMAGEM

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy (reinicia o app com a imagem nova)
        run: |
          kubectl -n $NAMESPACE rollout restart deployment/$DEPLOYMENT
          kubectl -n $NAMESPACE rollout status deployment/$DEPLOYMENT --timeout=300s