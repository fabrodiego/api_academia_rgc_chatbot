server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:academia_rgc_chatbot}?currentSchema=chatbot
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none   # schema é gerenciado pelos scripts SQL, não pelo Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: chatbot

chatbot:
  fallback-threshold: 0.18   # abaixo disso, encaminha para atendimento humano

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true