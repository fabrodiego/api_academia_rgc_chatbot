server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:academia_rgc_chatbot}?currentSchema=chatbot
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none   # schema é gerenciado pelos scripts SQL, não pelo Hibernate
    open-in-view: false
    properties:
      hibernate:
        default_schema: chatbot

chatbot:
  # Regras de decisão. Valores escolhidos por varredura leave-one-out no TREINO
  # (docs/resultados/calibracao.csv, linha com escolhido=1); critério no README.
  fallback-threshold: 0.46        # score da 1ª intent abaixo disso -> atendimento humano
  margem-minima: 0.02             # 1ª - 2ª intent abaixo disso -> ambíguo (contexto ou humano)
  fracao-minima-conhecida: 1.0    # fração mínima de tokens no vocabulário de treino
  contexto:
    ttl-minutos: 30        # sessão sem atividade por esse tempo perde a última intent
    max-sessoes: 10000     # teto do mapa em memória (descarta expiradas e depois a menos usada)
  # tratamento de "não": ignorar | manter | fundir | fundir_com_recuo (ver README e docs/resultados/calibracao.csv)
  negacao: fundir_com_recuo
  admin-key: ${ADMIN_KEY:}   # chave dos endpoints de dev (vazia = bloqueado)


management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true