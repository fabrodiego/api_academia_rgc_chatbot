<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avaliação do classificador · RGC Training</title>
<meta name="theme-color" content="#101820">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/demo.css">
</head>
<body class="tech">
<header class="tbar">
 <a class="logo" href="/">RGC<span>.</span>TRAINING</a>
 <h1 class="t">Avaliação do classificador</h1>
 <nav aria-label="Páginas técnicas"><a href="/demo.html">Demo</a><a href="/avaliacao.html" aria-current="page">Avaliação</a></nav>
</header>
<main class="av">
 <form id="keyform" class="keybox" autocomplete="off">
  <div class="grow">
   <label for="key">Chave de administrador</label>
   <input id="key" type="password" autocomplete="off" placeholder="Fica só na memória desta aba">
  </div>
  <div class="actions" role="group" aria-label="Ações">
   <button type="button" class="btn main sm" data-act="run">Executar testes</button>
   <button type="button" class="btn ghost sm" data-act="last">Última execução</button>
   <button type="button" class="btn ghost sm" data-act="csv">Baixar CSV</button>
   <button type="button" class="btn ghost sm" data-act="cmp">Comparar com baseline</button>
  </div>
 </form>
 <p id="status" role="status" aria-live="polite">Informe a chave e escolha uma ação.</p>
 <div id="result"></div>
</main>
<script src="js/config.js"></script>
<script src="js/avaliacao.js"></script>
</body>
</html>
